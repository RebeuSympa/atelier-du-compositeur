<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Atelier du Compositeur</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : console de studio — en-tête collant avec filtre de genre, onglets, colonne de contenu ~1100px.
   Couleur : ardoise profonde + laiton (cuivres de l'orchestre), une couleur par genre. */
:root{
  --bg:#15141b; --surface:#1e1c26; --raise:#272433; --line:#363244;
  --fg:#ece9f3; --muted:#a39db4; --accent:#d9a648; --accent-ink:#1b1505;
  --electro:#6aa8ff; --house:#ea72b0; --rap:#ee8a4c; --film:#d9a648; --ok:#5cc98b;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", Consolas, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f3f7; --surface:#ffffff; --raise:#ebeaf1; --line:#d6d3e0;
  --fg:#1c1a25; --muted:#5d586d; --accent:#9a6a12; --accent-ink:#fff8e8;
  --electro:#2a6ad1; --house:#b52f78; --rap:#b8551c; --film:#9a6a12; --ok:#1f8a52;
  color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#f3f3f7; --surface:#ffffff; --raise:#ebeaf1; --line:#d6d3e0;
  --fg:#1c1a25; --muted:#5d586d; --accent:#9a6a12; --accent-ink:#fff8e8;
  --electro:#2a6ad1; --house:#b52f78; --rap:#b8551c; --film:#9a6a12; --ok:#1f8a52;
  color-scheme:light; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:clamp(1.5rem,3.2vw,2.1rem);font-weight:800}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
code,kbd,.mono{font-family:var(--mono);font-size:.86em}
kbd{background:var(--raise);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* En-tête */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:12px}
.staff{width:38px;height:28px;flex:none}
.brand h1{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.78rem;font-family:var(--mono)}
.genres{display:flex;flex-wrap:wrap;gap:6px}
.chip{--c:var(--accent);border:1px solid var(--line);background:transparent;color:var(--fg);font:500 .85rem var(--body);padding:5px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--bg)}
.chip[aria-pressed="true"]::before{background:var(--bg)}
.chip[data-g="all"]::before{background:conic-gradient(var(--electro) 0 25%,var(--house) 0 50%,var(--rap) 0 75%,var(--film) 0)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{color:var(--muted);text-decoration:none;font-weight:500;padding:8px 14px 10px;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--fg);border-color:var(--accent)}
nav.tabs a:hover{color:var(--fg)}

main{padding-block:28px 80px}
section.view{display:grid;gap:22px}
.lede{color:var(--muted);max-width:68ch}
.g-electro{--c:var(--electro)} .g-house{--c:var(--house)} .g-rap{--c:var(--rap)} .g-film{--c:var(--film)} .g-all{--c:var(--accent)}
.tag{display:inline-block;font:500 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:4px;padding:0 6px;margin-right:4px}

/* Parcours */
.progress{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar{flex:1 1 220px;height:10px;background:var(--raise);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.pct{font:600 1rem var(--mono);font-variant-numeric:tabular-nums}
.stages{display:grid;gap:10px;counter-reset:st}
details.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.stage>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px}
details.stage>summary::-webkit-details-marker{display:none}
.num{font:700 1.4rem var(--display);color:var(--accent);width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
.stage-t{min-width:0}
.stage-t p{color:var(--muted);font-size:.9rem}
.count{font:500 .8rem var(--mono);color:var(--muted);white-space:nowrap}
.count.done{color:var(--ok)}
.stage-body{padding:0 16px 16px 16px;display:grid;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.tasks{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.tasks label{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;cursor:pointer}
.tasks input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.tasks input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.tip{background:var(--raise);border-radius:8px;padding:10px 14px;font-size:.92rem}
.tip b{color:var(--accent)}

/* Fiches genre */
.genre-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--c);padding-bottom:10px}
.card-head h3{font-size:1.45rem}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.spec{background:var(--raise);border-radius:8px;padding:8px 10px}
.spec dt{font:500 .68rem var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.spec dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.block h4{margin:0 0 6px;font:600 .78rem var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--c)}
.block ul{margin:0;padding-left:18px;display:grid;gap:4px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chain span{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font:500 .82rem var(--mono)}
.chain em{color:var(--muted);font-style:normal}

/* Modèles */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.88rem}
.model-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.model{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:16px;display:grid;gap:10px;align-content:start}
.model .meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font:500 .78rem var(--mono)}
.model ol{margin:0;padding-left:20px;display:grid;gap:5px;font-size:.93rem}
.model .goal{font-size:.9rem;color:var(--muted)}
.model .goal b{color:var(--fg)}
.done-btn{justify-self:start;border:1px solid var(--line);background:var(--raise);color:var(--fg);border-radius:6px;padding:5px 12px;font:500 .85rem var(--body);cursor:pointer}
.done-btn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--bg)}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--raise)}
tr:last-child td{border-bottom:0}
td.mono{white-space:nowrap;font-variant-numeric:tabular-nums}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.sub{display:flex;gap:6px;flex-wrap:wrap}
.sub button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:6px 12px;font:500 .88rem var(--body);cursor:pointer}
.sub button[aria-pressed="true"]{color:var(--fg);background:var(--raise);border-color:var(--accent)}
.recipe{display:grid;gap:6px}
.recipe h4{margin:0;font-family:var(--display);font-size:1.05rem}
.recipe p{color:var(--muted);font-size:.9rem}

/* Atelier */
.prog-list{display:grid;gap:8px}
.prog{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--raise);border:1px solid transparent;border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--fg);font:inherit}
.prog[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--raise))}
.prog small{display:block;color:var(--muted)}
.chords{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chord{background:var(--raise);border-radius:8px;padding:12px 8px;text-align:center;border:2px solid transparent;transition:border-color .1s}
.chord.on{border-color:var(--accent)}
.chord b{display:block;font:800 1.3rem var(--display)}
.chord span{font:400 .75rem var(--mono);color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 18px;font:600 .95rem var(--body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
input[type=number],select{background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:500 .95rem var(--mono);width:6.5em}
label.inl{display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem}
.price{font:600 .7rem var(--mono);letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 7px;white-space:nowrap}
.price.free{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.price.cheap{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.price.paid{background:var(--raise);color:var(--muted)}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.tool-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tool-head h4{margin:0;font:700 1.05rem var(--display)}
.tool p{color:var(--muted);font-size:.9rem}
.tool-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem}
.tool-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.cat-title{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.cat-title span{color:var(--muted);font-size:.9rem}
/* HUD & quêtes */
.hud{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;font-size:.82rem}
.hud .lv{background:var(--accent);color:var(--accent-ink);font:800 .85rem var(--display);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;padding:0 6px}
.hud .mini{width:70px;height:5px;background:var(--raise);border-radius:9px;overflow:hidden;display:block;margin-top:2px}
.hud .mini i{display:block;height:100%;background:var(--accent)}
.hero-q{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.big-lv{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font:800 2.2rem var(--display);color:var(--accent-ink);background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--raise) 0);position:relative}
.big-lv span{position:absolute;inset:7px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.hero-q h2{font-size:1.6rem}
.hero-q p{color:var(--muted)}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.rec{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.rec .kind{font:600 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.rec .xp{font:600 .75rem var(--mono);color:var(--ok)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.node{position:relative;overflow:hidden;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-decoration:none;color:var(--fg);font-size:.85rem;min-height:64px}
.node .fill{position:absolute;inset:auto 0 0 0;height:4px;background:var(--accent)}
.node b{display:block;font:700 .75rem var(--mono);color:var(--muted)}
.node.cur{border-color:var(--accent)}
.node.full{border-color:var(--ok)} .node.full .fill{background:var(--ok)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px;text-align:center;display:grid;gap:4px;opacity:.45}
.badge.on{opacity:1;border-style:solid;border-color:var(--accent)}
.badge .ico{font-size:1.6rem;line-height:1}
.badge b{font:700 .9rem var(--display)}
.badge small{color:var(--muted);font-size:.75rem}
/* Remake */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;align-items:end}
.field{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.field input,.field select,textarea{width:100%;background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:400 .95rem var(--body)}
textarea{min-height:90px;resize:vertical}
.rm-list{display:flex;gap:8px;flex-wrap:wrap}
.rm-list button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;font:500 .88rem var(--body);cursor:pointer;text-align:left}
.rm-list button[aria-pressed="true"]{border-color:var(--accent);background:var(--raise)}
.rm-list small{display:block;color:var(--muted);font-size:.75rem}
.tap{width:100%;min-height:110px;border-radius:12px;border:2px dashed var(--accent);background:var(--raise);color:var(--fg);font:800 2rem var(--display);cursor:pointer;font-variant-numeric:tabular-nums}
.tap:active{background:color-mix(in srgb,var(--accent) 20%,var(--raise))}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.keys button{border:1px solid var(--line);background:var(--raise);color:var(--fg);border-radius:6px;padding:8px 0;font:600 .85rem var(--mono);cursor:pointer}
.plan{display:grid;gap:14px}
.warn{border:1px solid var(--rap);border-radius:8px;padding:10px 14px;font-size:.92rem}
.status{color:var(--muted);font-size:.9rem}
.vid-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
/* Navigation en 3 espaces */
nav.groups{display:flex;gap:6px;padding-bottom:4px}
nav.groups button{flex:1 1 0;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:6px 10px;font:600 .9rem var(--display);cursor:pointer;text-align:left}
nav.groups button small{display:block;font:400 .72rem var(--body);color:var(--muted)}
nav.groups button[aria-current="true"]{color:var(--fg);border-color:var(--accent);background:var(--surface)}
@media (max-width:640px){
  header{position:static}
  .top{flex-wrap:nowrap;flex-direction:column;align-items:stretch;gap:8px}
  .genres{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .brand small,nav.groups button small{display:none}
}
/* Clavier dessiné */
.kb{position:relative;display:flex;height:130px;user-select:none;max-width:640px}
.kb .w{flex:1;border:1px solid var(--line);background:#f7f6fb;border-radius:0 0 6px 6px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font:600 .68rem var(--mono);color:#555}
.kb .b{position:absolute;top:0;height:62%;background:#24212c;border-radius:0 0 4px 4px;cursor:pointer;z-index:2;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font:600 .6rem var(--mono);color:#ccc}
.kb .on.w{background:var(--accent);color:var(--accent-ink)} .kb .on.b{background:var(--accent);color:var(--accent-ink)}
.kb .root.w,.kb .root.b{box-shadow:inset 0 -6px 0 var(--ok)}
/* Oreille, journal, quiz */
.answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.answers button{border:1px solid var(--line);background:var(--raise);color:var(--fg);border-radius:8px;padding:10px;font:500 .9rem var(--body);cursor:pointer}
.answers button.good{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.answers button.bad{border-color:var(--rap);color:var(--rap)}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{border-radius:3px;background:var(--raise)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--ok) 35%,var(--raise))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--ok) 65%,var(--raise))}
.heat i[data-l="3"]{background:var(--ok)}
.timer{font:800 clamp(2.4rem,7vw,3.4rem) var(--display);font-variant-numeric:tabular-nums}
.quiz{display:grid;gap:12px;background:var(--raise);border-radius:8px;padding:12px 14px}
.quiz .answers button{background:var(--surface)}
.answer{white-space:pre-wrap;background:var(--raise);border-radius:8px;padding:12px 14px;font-size:.93rem}
.hits td input{width:100%;min-width:70px;background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font:400 .9rem var(--mono)}
.okc{color:var(--ok)} .badc{color:var(--rap)}
.org{display:grid;gap:10px}
.org li{padding-left:2px}
@media (max-width:520px){.chords{grid-template-columns:repeat(2,1fr)} .num{font-size:1.1rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <svg class="staff" viewBox="0 0 38 28" aria-hidden="true"><g stroke="currentColor" stroke-width="1.2" opacity=".55"><line x1="0" y1="4" x2="38" y2="4"/><line x1="0" y1="10" x2="38" y2="10"/><line x1="0" y1="16" x2="38" y2="16"/><line x1="0" y1="22" x2="38" y2="22"/></g><ellipse cx="12" cy="19" rx="4.2" ry="3" fill="var(--accent)" transform="rotate(-20 12 19)"/><line x1="15.8" y1="18" x2="15.8" y2="2" stroke="var(--accent)" stroke-width="1.8"/><ellipse cx="27" cy="13" rx="4.2" ry="3" fill="var(--accent)" transform="rotate(-20 27 13)"/><line x1="30.8" y1="12" x2="30.8" y2="0" stroke="var(--accent)" stroke-width="1.8"/></svg>
        <div><h1>Atelier du Compositeur</h1><small>FL Studio Producer · Vital · BBC Symphony Orchestra</small></div>
      </div>
      <a class="hud" href="#quetes" id="hud" aria-label="Ton niveau"></a>
      <div class="genres" role="group" aria-label="Filtrer par style">

// La progression est gardée dans le navigateur ET, quand la page est ouverte dans Claude, dans ton compte (db).
// Chaque remake a son propre document (rm-<id>) pour ne jamais dépasser la taille d'un document.
const SYNC = ["checks","models","installed","seen","quiz","ear","journal","spot"];
let dbDoc = null, dbCol = null, syncT = null;
const caps = {};
async function cap(n){ if(!(n in caps)){ try{ caps[n] = window.claude ? await window.claude.use(n) : null; }catch(e){ caps[n] = null; } } return caps[n]; }
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v, quiet){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
    if(SYNC.includes(k) && !quiet){ try{ localStorage.setItem("updatedAt", Date.now()); }catch(e){} queueSync(); if(typeof hud==="function") hud(); } }
};
function queueSync(){ if(!dbDoc) return; clearTimeout(syncT); syncT = setTimeout(()=>{
  const o = {updatedAt: store.get("updatedAt",0)}; SYNC.forEach(k=>o[k]=store.get(k,{}));
  dbDoc.set(o).catch(()=>{}); }, 800); }
const rmTimers = {};
function syncRemake(r, gone){ if(!dbCol) return; const ref = dbCol.doc("rm-"+r.id);
  if(gone){ ref.delete().catch(()=>{}); return; }
  clearTimeout(rmTimers[r.id]); rmTimers[r.id] = setTimeout(()=>ref.set(JSON.parse(JSON.stringify(r))).catch(()=>{}), 800); }
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function renderParcours(){
  const el = document.getElementById("v-parcours");
  let total=0, done=0;
  const rows = STAGES.map((s,i)=>{
    const tasks = s.tasks.map((t,j)=>({g:t[0], txt:t[1], id:`s${i}t${j}`})).filter(t=>fits([t.g]));
    if(!tasks.length) return "";
    const d = tasks.filter(t=>checks[t.id]).length; total+=tasks.length; done+=d;
    return `<details class="stage" ${store.get("open"+i,false)?"open":""} data-i="${i}">
      <summary><span class="num">${String(i+1).padStart(2,"0")}</span>
        <span class="stage-t"><h3>${s.t}</h3><p>${s.d}</p></span>
        <span class="count ${d===tasks.length?"done":""}">${d}/${tasks.length}</span></summary>
      <div class="stage-body"><ul class="tasks">${tasks.map(t=>`<li><label><input type="checkbox" id="${t.id}" ${checks[t.id]?"checked":""}><span>${t.g!=="all"?tagHtml([t.g]):""}${t.txt}</span></label></li>`).join("")}</ul>
      ${s.tip?`<div class="tip">${s.tip}</div>`:""}</div></details>`;
  }).join("");
  const pct = total? Math.round(done/total*100):0;
  el.innerHTML = `<div><h2>Ton parcours, étape par étape</h2>
    <p class="lede">Douze étapes dans l'ordre, du réglage du studio jusqu'à la composition à l'image. Coche ce que tu maîtrises ; ta progression reste enregistrée dans ce navigateur. Filtre par style en haut pour ne voir que ce qui te concerne (${GN[genre]}).</p></div>
    <div class="progress"><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><span class="pct">${pct} %</span><span class="count">${done} / ${total} acquis</span></div>
    <div class="stages">${rows}</div>`;
  el.querySelectorAll("details.stage").forEach(d=>{ const v = VIDEOS.filter(x=>x.s===+d.dataset.i && fits(x.g)); if(v.length) d.querySelector(".stage-body").insertAdjacentHTML("beforeend",
    `<div class="block"><h4 style="color:var(--accent)">Pour apprendre cette étape</h4><ul>${v.map(x=>`<li><a href="${vidUrl(x)}" target="_blank" rel="noopener">${x.t} ↗</a> <span class="count">${x.u?"article":"vidéos YouTube"}</span></li>`).join("")}</ul></div>`); });
  cap("sample").then(s=>{ if(!s) return; el.querySelectorAll("details.stage").forEach(d=>{ const i=+d.dataset.i;
    d.querySelector(".stage-body").insertAdjacentHTML("beforeend", `<div class="block"><h4 style="color:var(--accent)">Valider l'étape</h4>${quiz[i]?`<p class="okc">✓ Étape certifiée par quiz</p>`:""}
      <div class="controls"><button class="btn ghost" data-quiz="${i}">${quiz[i]?"Refaire un quiz":"Teste-toi : 3 questions (+30 XP)"}</button></div><div class="qbox" style="display:grid;gap:10px"></div></div>`);
    const b=d.querySelector("[data-quiz]"); b.onclick=()=>{ b.disabled=true; startQuiz(i, d.querySelector(".qbox")); }; }); });
  el.querySelectorAll(".tasks input").forEach(cb=>cb.addEventListener("change",()=>{ checks[cb.id]=cb.checked; store.set("checks",checks); renderParcours(); }));
  el.querySelectorAll("details.stage").forEach(d=>d.addEventListener("toggle",()=>store.set("open"+d.dataset.i,d.open)));
}

function voice(freq,t0,dur,gainV,out,nodes){
  const g=ctx.createGain(); g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(gainV,t0+0.04); g.gain.setTargetAtTime(gainV*0.6,t0+0.1,0.4); g.gain.setTargetAtTime(0,t0+dur-0.05,0.08); g.connect(out);
  [["sawtooth",-6],["triangle",5]].forEach(([type,det])=>{const o=ctx.createOscillator(); o.type=type; o.frequency.value=freq; o.detune.value=det; o.connect(g); o.start(t0); o.stop(t0+dur+0.4); nodes.push(o);});
}
function play(){
  if(playing){ stopPlay(); return; }
  try{ ctx = ctx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  ctx.resume();
  const p=PROGS[progI], bpm=Math.max(40,Math.min(200,+document.getElementById("bpm").value||p.bpm)), bar=240/bpm, loops=2;
  const out=ctx.createBiquadFilter(); out.type="lowpass"; out.frequency.value=1800; const master=ctx.createGain(); master.gain.value=0.5; out.connect(master); master.connect(ctx.destination);
  const nodes=[], timers=[], t0=ctx.currentTime+0.05;
  for(let l=0;l<loops;l++) p.ch.forEach((c,i)=>{ const t=t0+(l*4+i)*bar;
    c[2].forEach(m=>voice(440*Math.pow(2,(m-69)/12),t,bar,0.09,out,nodes)); voice(440*Math.pow(2,(c[1]-69)/12),t,bar,0.14,out,nodes);
    timers.push(setTimeout(()=>{document.querySelectorAll(".chord").forEach((el,j)=>el.classList.toggle("on",j===i));},(t-ctx.currentTime)*1000)); });

  playing={nodes,timers}; document.getElementById("play").textContent="■ Stop";
}

  const list = PROGS.map((p,i)=>({p,i})).filter(x=>fits([x.p.g]));
  if(!list.some(x=>x.i===progI)) progI = list[0].i;
  const p=PROGS[progI];
  document.getElementById("v-atelier").innerHTML = `<div><h2>Atelier</h2><p class="lede">Écoute les progressions des modèles, puis rejoue-les sur ton clavier MIDI avec les notes indiquées (convention FL, Do central = C5). Le son ici est un simple synthé de démonstration : le vrai son viendra de Vital ou BBC SO.</p></div>
  <div class="two">
   <div class="card"><h3>Progressions d'accords</h3><div class="prog-list">${list.map(x=>`<button class="prog g-${x.p.g}" data-i="${x.i}" aria-pressed="${x.i===progI}"><span><b>${x.p.n}</b><small>${x.p.k}</small></span><span class="tag g-${x.p.g}">${GN[x.p.g]}</span></button>`).join("")}</div></div>
   <div class="card g-${p.g}"><h3>${p.n}</h3>
    <div class="chords">${p.ch.map(c=>{const fl=c[3]??p.flats; return `<div class="chord"><b>${c[0]}</b><span>basse ${nn(c[1],fl)}</span><br><span>${c[2].map(m=>nn(m,fl)).join(" ")}</span></div>`;}).join("")}</div>
    <div class="controls"><button class="btn" id="play">▶ Écouter</button><label class="inl" for="bpm">Tempo <input type="number" id="bpm" min="40" max="200" value="${p.bpm}"></label><button class="btn ghost" id="at-midi">⬇ Exporter en MIDI</button><span class="count" id="at-midi-st">1 mesure par accord</span></div>
    <div class="tip"><b>Exercice :</b> joue la basse main gauche et l'accord main droite. Puis invente une mélodie par-dessus en restant dans la gamme : ${p.k}.</div>
   </div>
  </div>
  <div class="card"><h3>Calculateur de tempo</h3><p class="lede">Durées en millisecondes pour régler un delay, le pre-delay d'une reverb ou le release d'un sidechain, et la durée en secondes d'un passage (utile pour caler une musique sur une scène).</p>
   <div class="controls"><label class="inl" for="cbpm">BPM <input type="number" id="cbpm" min="20" max="300" value="${p.bpm}"></label><label class="inl" for="cbars">Mesures <input type="number" id="cbars" min="1" max="512" value="8"></label></div>
   <div class="tbl-wrap" id="calc-out"></div></div>`;
  document.querySelectorAll(".prog").forEach(b=>b.addEventListener("click",()=>{stopPlay();progI=+b.dataset.i;renderAtelier();}));
  document.getElementById("play").addEventListener("click",play);
  document.getElementById("at-midi").addEventListener("click",async()=>{ document.getElementById("at-midi-st").textContent =
    await saveMidi(p.n.replace(/[^\w\- ]+/g,"").trim()||"progression", midiFile(p.ch.map(c=>({bass:c[1],notes:c[2]})), +document.getElementById("bpm").value||p.bpm)); });
  ["cbpm","cbars"].forEach(id=>document.getElementById(id).addEventListener("input",calc)); calc();
}

   ${cats.map(c=>`<div class="cat-title"><h3>${c.cat}</h3><span>${c.items.length} outil${c.items.length>1?"s":""}</span></div>

    const prompt = `Tu es un professeur de production musicale. L'élève veut refaire, pour apprendre et sans le publier, le morceau « ${r.title} » de ${r.artist}${r.url?` (vidéo YouTube : ${r.url})`:""}. Style : ${GN[r.genre]}. Son niveau : ${level().name}.
Son matériel : FL Studio Producer Edition, Vital, BBC Symphony Orchestra (version inconnue : Discover, Core ou Pro), un clavier MIDI, et ces plugins gratuits : Spitfire LABS, Surge XT, Dexed, Valhalla Supermassive, TDR Nova, Xfer OTT, Youlean Loudness Meter, Voxengo SPAN.

Ne cite aucune parole et ne transcris pas la mélodie note par note : donne des indices (contour, rythme, gamme, intervalles marquants) pour que l'élève la retrouve lui-même. Tu peux indiquer la progression d'accords.
Réponds uniquement avec un objet JSON, en français, de cette forme :
{"avertissement": string ou null, "tempo": string, "tonalite": string, "ambiance": string, "progression": [string], "structure": [{"section": string, "mesures": string, "contenu": string}], "sons": [{"role": string, "plugin": string, "comment": string}], "etapes": [{"titre": string, "detail": string}], "conseils": [string], "a_ecouter": [string]}
"progression" : la boucle d'accords principale, un accord par mesure, en notation anglaise simple (ex. "Am", "F", "Cmaj7", "G/B", "Dm7"), tableau vide si tu ne sais pas. "etapes" : 8 à 12 étapes concrètes dans FL Studio, dans l'ordre, chacune faisable en une session. "sons" : un par élément important, avec une recette de réglage courte.`;
    try{

      r.plan = plan; Object.keys(r.steps).filter(k=>k[0]==="p").forEach(k=>delete r.steps[k]); saveRm(r); renderRemake();
    }catch(e){
      const msg = {not_granted:"Tu n'as pas autorisé la page à utiliser Claude.",rate_limited:"Trop de demandes pour l'instant : réessaie dans quelques minutes.",invalid_json:"La réponse n'était pas au bon format : clique pour réessayer.",refused:"Claude n'a pas pu traiter ce morceau : essaie avec un autre titre.",cancelled:""}[e&&e.code];
      st.textContent = msg ?? "Erreur passagère : réessaie.";
      if(["not_granted","sampling_disabled","not_declared"].includes(e&&e.code)) ask.hidden=true;
    }finally{ ask.disabled=false; stop.hidden=true; }
  };
  stop.onclick = ()=> rmCtl && rmCtl.abort();
}

/* ---------- MIDI ---------- */
// Fichier MIDI type 0 : un accord (basse + notes) par mesure de 4 temps.
function midiFile(chords, bpm){
  const ppq=480, bar=ppq*4, ev=[], vlq=n=>{const b=[n&127]; while(n>>=7) b.unshift((n&127)|128); return b;};
  chords.forEach((c,i)=>{ const t=i*bar; [...(c.bass!=null?[c.bass]:[]),...c.notes].forEach(n=>{ ev.push([t,1,[0x90,n,90]]); ev.push([t+bar-20,0,[0x80,n,0]]); }); });
  ev.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const us=Math.round(60000000/Math.max(20,Math.min(300,bpm||120)));
  let tr=[0,0xFF,0x51,3,(us>>16)&255,(us>>8)&255,us&255], last=0;
  ev.forEach(([t,,b])=>{ tr.push(...vlq(t-last),...b); last=t; });
  tr.push(0,0xFF,0x2F,0);
  const len=tr.length, head=[77,84,104,100,0,0,0,6,0,0,0,1,ppq>>8,ppq&255,77,84,114,107,(len>>>24)&255,(len>>16)&255,(len>>8)&255,len&255];
  return new Uint8Array([...head,...tr]);
}
// Le .mid n'est pas autorisé au téléchargement dans Claude : on l'emballe dans un .zip (sans compression).
const CRC = Array.from({length:256},(_,n)=>{ for(let k=0;k<8;k++) n = n&1 ? 0xEDB88320^(n>>>1) : n>>>1; return n>>>0; });
function zipOne(name, data){
  let crc=0xFFFFFFFF; data.forEach(b=>crc=CRC[(crc^b)&255]^(crc>>>8)); crc=(crc^0xFFFFFFFF)>>>0;
  const nm=new TextEncoder().encode(name), out=new Uint8Array(30+nm.length+data.length+46+nm.length+22), v=new DataView(out.buffer);
  const hdr=(o,central)=>{ let p=o; v.setUint32(p,central?0x02014b50:0x04034b50,true); p+=4; if(central){ v.setUint16(p,20,true); p+=2; }
    v.setUint16(p,20,true); v.setUint16(p+2,0,true); v.setUint16(p+4,0,true); v.setUint16(p+6,0,true); v.setUint16(p+8,0x21,true);
    v.setUint32(p+10,crc,true); v.setUint32(p+14,data.length,true); v.setUint32(p+18,data.length,true); v.setUint16(p+22,nm.length,true); v.setUint16(p+24,0,true); p+=26;
    if(central){ p+=14; } out.set(nm,p); return p+nm.length; };   // central : commentaire, disque, attributs, offset = 0
  let p=hdr(0,false); out.set(data,p); p+=data.length; const cd=p; p=hdr(cd,true);
  v.setUint32(p,0x06054b50,true); v.setUint16(p+8,1,true); v.setUint16(p+10,1,true); v.setUint32(p+12,p-cd,true); v.setUint32(p+16,cd,true);
  return out;
}
async function saveMidi(name, bytes){
  if(!window.claude){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([bytes],{type:"audio/midi"})); a.download=name+".mid"; document.body.append(a); a.click(); a.remove();
    return "Fichier .mid téléchargé : glisse-le dans le Piano Roll ou la Playlist de FL."; }
  const dl = await cap("downloads"); if(!dl) return "Téléchargement indisponible ici.";
  try{ await dl.save({filename:name+".zip", data:zipOne(name+".mid", bytes)}); return "Enregistré : ouvre le .zip et glisse le .mid dans FL."; }
  catch(e){ return e&&e.code==="declined" ? "" : "Téléchargement impossible ici."; }
}
// "Am7", "F#m", "Bb/D", "Cmaj7"… → {name, bass, notes} ; null si non reconnu.
function parseChord(sym){
  const m=/^([A-G])([#♯b♭]?)(maj9|maj7|M7|m7b5|m9|m7|m6|madd9|min|m|dim7|dim|°|aug|\+|sus2|sus4|7sus4|add9|9|7|6|5)?(?:\/([A-G])([#♯b♭]?))?$/.exec(sym.replace(/\s+/g,""));
  if(!m) return null;
  const pc={C:0,D:2,E:4,F:5,G:7,A:9,B:11}, acc=a=>(a==="#"||a==="♯")?1:(a==="b"||a==="♭")?-1:0, root=(pc[m[1]]+acc(m[2])+12)%12;
  const Q={"":[0,4,7],maj7:[0,4,7,11],M7:[0,4,7,11],maj9:[0,4,7,11,14],m:[0,3,7],min:[0,3,7],m7:[0,3,7,10],m9:[0,3,7,10,14],m6:[0,3,7,9],madd9:[0,3,7,14],m7b5:[0,3,6,10],dim:[0,3,6],"°":[0,3,6],dim7:[0,3,6,9],aug:[0,4,8],"+":[0,4,8],sus2:[0,2,7],sus4:[0,5,7],"7sus4":[0,5,7,10],add9:[0,4,7,14],"9":[0,4,7,10,14],"7":[0,4,7,10],"6":[0,4,7,9],"5":[0,7]}[m[3]||""];
  const base=57+((root-9+12)%12), bpc=m[4]?(pc[m[4]]+acc(m[5])+12)%12:root;
  return {name:sym, bass:36+bpc, notes:Q.map(i=>base+i)};
}
function tone(midis, {at=0, dur=1, type="triangle", vol=.18, gap=0}={}){
  try{ ctx = ctx || new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); }catch(e){ return; }
  const t0=ctx.currentTime+.05+at;
  midis.forEach((m,i)=>{ const t=t0+i*gap, o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.value=440*Math.pow(2,(m-69)/12);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.setTargetAtTime(0,t+dur-.1,.08); o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+.4); });
}

const EAR_LEVELS = {
  intervalles:{label:"Intervalles", easy:[3,4,5,7,12], all:INTERVALS.map(i=>i[0])},
  accords:{label:"Accords", easy:[0,1], all:CHORDQ.map((_,i)=>i)},
  modes:{label:"Modes", easy:["ionien","eolien"], all:["ionien","eolien","dorien","phrygien","lydien","mixolydien"]}

let ear = store.get("ear",{ok:0,total:0,best:0}), earMode = store.get("earMode","intervalles"), earHard = store.get("earHard",false), earQ=null, earStreak=0;
function earNew(){
  const L=EAR_LEVELS[earMode], pool=earHard?L.all:L.easy, ans=pool[Math.floor(Math.random()*pool.length)], root=48+Math.floor(Math.random()*12);

function earPlay(){ if(!earQ) return; const {ans,root}=earQ;

  if(earMode==="modes"){ const s=SCALES.find(x=>x[0]===ans)[2]; tone([...s,12].map(i=>root+12+i),{dur:.42,gap:.3}); }

const dayKey = d => d.toLocaleDateString("sv-SE");

function streak(){ let s=0, d=new Date(); if(!(+journal[dayKey(d)]>=15)) d.setDate(d.getDate()-1); while(+journal[dayKey(d)]>=15){ s++; d.setDate(d.getDate()-1); } return s; }

/* ---------- SYNCHRO IMAGE ---------- */
let spot = store.get("spot",{start:"0", min:70, max:140, sub:2, hits:[{t:"0:12.5",d:"Coupe : plan large"},{t:"0:24.0",d:"Le héros se retourne"},{t:"0:41.3",d:"Explosion"}], bpm:null});
const parseTC = s => { s=String(s).trim().replace(",","."); const m=/^(?:(\d+):)?(\d+(?:\.\d+)?)$/.exec(s); return m ? (+(m[1]||0))*60 + (+m[2]) : NaN; };
function fitTempo(){
  const st=parseTC(spot.start)||0, hits=spot.hits.map(h=>parseTC(h.t)).filter(t=>!isNaN(t)&&t>=st), res=[];
  if(!hits.length) return [];
  for(let b=Math.max(20,+spot.min||60); b<=Math.min(300,+spot.max||180); b=Math.round((b+.1)*10)/10){
    const u=60/b/(+spot.sub||1), devs=hits.map(t=>{ const x=(t-st)/u; return Math.abs(x-Math.round(x))*u*1000; });
    res.push({b, mean:devs.reduce((a,c)=>a+c,0)/devs.length, max:Math.max(...devs)}); }
  res.sort((a,b)=>a.mean-b.mean); const top=[]; res.forEach(r=>{ if(top.length<5 && top.every(t=>Math.abs(t.b-r.b)>=2)) top.push(r); }); return top;
}
function posOf(t, bpm){ const st=parseTC(spot.start)||0, beat=60/bpm, n=(t-st)/beat, bar=Math.floor(n/4)+1, bt=n-(bar-1)*4;
  const sub=+spot.sub||1, q=Math.round(bt*sub)/sub, dev=Math.round((bt-q)*beat*1000); return {txt:`${bar}.${Math.floor(q)+1}${sub>1&&q%1?` +${Math.round((q%1)*sub)}/${sub}`:""}`, dev}; }
function spotText(){ const b=spot.bpm; return `Fiche de repérage — début musique ${spot.start}, tempo ${b??"?"} BPM\n\n` + spot.hits.map((h,i)=>{ const t=parseTC(h.t), p=b&&!isNaN(t)?posOf(t,b):null; return `${i+1}. ${h.t}  ${p?`mesure ${p.txt} (${p.dev>0?"+":""}${p.dev} ms)`:""}  ${h.d}`; }).join("\n"); }
function renderImage(){
  const top=fitTempo(); if(spot.bpm==null && top[0]) spot.bpm=top[0].b;
  document.getElementById("v-image").innerHTML = `<div><h2>Synchro à l'image</h2><p class="lede">Note les moments clés de ta scène (coupes, actions, émotions). L'outil cherche le tempo qui fait tomber le plus de moments sur un temps, puis te donne la mesure exacte de chacun : tu n'as plus qu'à placer tes accents dans FL.</p></div>
   <div class="card"><div class="form">
     <label class="field" for="sp-start">Début de la musique (m:ss)<input id="sp-start" value="${esc(spot.start)}"></label>
     <label class="field" for="sp-min">Tempo min<input id="sp-min" type="number" value="${spot.min}"></label>
     <label class="field" for="sp-max">Tempo max<input id="sp-max" type="number" value="${spot.max}"></label>
     <label class="field" for="sp-sub">Accents sur<select id="sp-sub"><option value="1" ${spot.sub==1?"selected":""}>les temps (noires)</option><option value="2" ${spot.sub==2?"selected":""}>les croches</option><option value="4" ${spot.sub==4?"selected":""}>les doubles croches</option></select></label></div>
    <div class="tbl-wrap hits" style="margin-top:12px"><table><thead><tr><th>#</th><th>Timecode (m:ss.d)</th><th>Moment</th><th>Position</th><th></th></tr></thead><tbody>
     ${spot.hits.map((h,i)=>{ const t=parseTC(h.t), p=spot.bpm&&!isNaN(t)?posOf(t,spot.bpm):null; return `<tr><td>${i+1}</td><td><input data-i="${i}" data-f="t" value="${esc(h.t)}" aria-label="Timecode ${i+1}"></td><td><input data-i="${i}" data-f="d" value="${esc(h.d)}" aria-label="Moment ${i+1}"></td>
       <td class="mono ${p?(Math.abs(p.dev)<=40?"okc":"badc"):""}">${isNaN(t)?"format ?":p?`${p.txt} · ${p.dev>0?"+":""}${p.dev} ms`:""}</td><td><button class="btn ghost" data-del="${i}" aria-label="Supprimer">✕</button></td></tr>`; }).join("")}
    </tbody></table></div>
    <div class="controls" style="margin-top:10px"><button class="btn ghost" id="sp-add">+ Ajouter un moment</button><button class="btn ghost" id="sp-copy">Copier la fiche</button><button class="btn ghost" id="sp-dl">⬇ Télécharger (.txt)</button><span class="status" id="sp-st"></span></div></div>
   <div class="card"><h3>Tempos proposés</h3>${top.length?`<div class="prog-list">${top.map(r=>`<button class="prog g-film" data-b="${r.b}" aria-pressed="${r.b===spot.bpm}"><span><b>${r.b} BPM</b><small>écart moyen ${Math.round(r.mean)} ms · pire ${Math.round(r.max)} ms</small></span><span class="tag g-film">${r.mean<25?"parfait":r.mean<60?"bon":"à ajuster"}</span></button>`).join("")}</div>
    <p class="lede" style="margin-top:8px">Moins de 40 ms d'écart passe inaperçu. Au-delà, ajuste avec une automation de tempo dans FL, ou déplace le début de la musique.</p>`:`<p class="lede">Ajoute au moins un moment après le début de la musique.</p>`}</div>
   <div class="tip"><b>Dans FL :</b> règle le tempo choisi, charge la vidéo dans Fruity Video Player 2, puis place un marqueur de temps sur chaque position de la fiche.</div>`;
  const re=()=>{ store.set("spot",spot); renderImage(); };
  [["sp-start","start"],["sp-min","min"],["sp-max","max"],["sp-sub","sub"]].forEach(([id,k])=>document.getElementById(id).onchange=e=>{ spot[k]=e.target.value; spot.bpm=null; re(); });
  document.querySelectorAll("#v-image .hits input").forEach(inp=>inp.onchange=()=>{ spot.hits[+inp.dataset.i][inp.dataset.f]=inp.value.slice(0,200); if(inp.dataset.f==="t") spot.bpm=null; re(); });
  document.querySelectorAll("#v-image [data-del]").forEach(b=>b.onclick=()=>{ spot.hits.splice(+b.dataset.del,1); spot.bpm=null; re(); });
  document.getElementById("sp-add").onclick=()=>{ if(spot.hits.length<60){ spot.hits.push({t:"",d:""}); re(); } };
  document.querySelectorAll("#v-image [data-b]").forEach(b=>b.onclick=()=>{ spot.bpm=+b.dataset.b; re(); });
  const st=document.getElementById("sp-st");
  document.getElementById("sp-copy").onclick=async()=>{ try{ await navigator.clipboard.writeText(spotText()); st.textContent="Fiche copiée."; }catch(e){ st.textContent="Copie impossible ici : utilise Télécharger."; } };
  document.getElementById("sp-dl").onclick=async()=>{ const txt=spotText();
    if(!window.claude){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"})); a.download="fiche-reperage.txt"; document.body.append(a); a.click(); a.remove(); return; }
    const dl=await cap("downloads"); if(!dl){ st.textContent="Téléchargement indisponible ici."; return; }
    try{ await dl.save({filename:"fiche-reperage.txt", data:txt}); st.textContent="Fiche enregistrée."; }catch(e){ st.textContent=e&&e.code==="declined"?"":"Téléchargement impossible."; } };
}

let quiz = store.get("quiz",{}), quizState = {};
async function startQuiz(i, box){
  const s = await cap("sample"); if(!s) return;
  box.innerHTML = `<p class="status">Claude prépare 3 questions…</p>`;
  const st=STAGES[i], tasks=st.tasks.map(t=>t[1]).join("\n- ");
  try{
    const qs = await s.json(`Crée un mini-quiz de validation, en français, pour un élève qui apprend FL Studio. Étape : « ${st.t} ». Ce que l'étape enseigne :\n- ${tasks}\n\nÉcris 3 questions à choix multiples, pratiques (que faire dans FL ou quel son/choix musical), pas de pièges sur des détails de menu. Réponds uniquement avec un tableau JSON : [{"q": string, "choix": [4 strings], "bonne": index 0-3, "explication": string courte}]`, {cache:false, modelTier:"quick"});
    if(!Array.isArray(qs) || !qs.length) throw {code:"invalid_json"};
    quizState[i] = {qs:qs.slice(0,3), picks:{}}; drawQuiz(i, box);
  }catch(e){ box.innerHTML = `<p class="status">${e&&e.code==="not_granted"?"Tu n'as pas autorisé la page à utiliser Claude.":"Le quiz n'a pas pu être créé : réessaie."}</p>`; }
}
function drawQuiz(i, box){
  const S=quizState[i], done=Object.keys(S.picks).length===S.qs.length, score=S.qs.filter((q,k)=>S.picks[k]===+q.bonne).length;
  if(done && score>=2 && !quiz[i]){ quiz[i]=true; store.set("quiz",quiz); }
  box.innerHTML = S.qs.map((q,k)=>{ const p=S.picks[k]; return `<div class="quiz"><b>${k+1}. ${esc(q.q)}</b><div class="answers">${(q.choix||[]).map((c,j)=>`<button data-k="${k}" data-j="${j}" class="${p!=null?(j===+q.bonne?"good":j===p?"bad":""):""}" ${p!=null?"disabled":""}>${esc(c)}</button>`).join("")}</div>${p!=null?`<p class="status">${esc(q.explication)}</p>`:""}</div>`; }).join("")
   + (done?`<p class="${score>=2?"okc":"badc"}"><b>${score}/${S.qs.length}</b> ${score>=2?"· Étape certifiée, +30 XP !":"· Révise un peu et retente ta chance."}</p>`:"");
  box.querySelectorAll("button[data-k]").forEach(b=>b.onclick=()=>{ S.picks[+b.dataset.k]=+b.dataset.j; drawQuiz(i, box); });
}

// Fusion : une case cochée sur un appareil reste cochée ; le journal garde le plus grand total du jour.
function mergeMaps(a,b,max){ const o={...(a||{})}; for(const k in (b||{})) o[k] = max ? Math.max(+o[k]||0, +b[k]||0) : (o[k] || b[k]); return o; }
function applyRemote(d, merge){
  const pick = (k,cur) => merge ? mergeMaps(cur, d[k], k==="journal") : (d[k]||{});
  checks=pick("checks",checks); doneModels=pick("models",doneModels); installed=pick("installed",installed); seen=pick("seen",seen);
  quiz=pick("quiz",quiz); journal=pick("journal",journal);
  ear = merge ? {ok:Math.max(ear.ok||0,(d.ear||{}).ok||0), total:Math.max(ear.total||0,(d.ear||{}).total||0), best:Math.max(ear.best||0,(d.ear||{}).best||0)} : (d.ear||{ok:0,total:0,best:0});
  spot = (d.spot && d.spot.hits) ? d.spot : spot;
  [["checks",checks],["models",doneModels],["installed",installed],["seen",seen],["quiz",quiz],["ear",ear],["journal",journal],["spot",spot]].forEach(([k,v])=>store.set(k,v,true));
  store.set("updatedAt", merge ? Date.now() : (d.updatedAt||0), true);
  show();
}
(async()=>{ try{
  const [db,user] = [await cap("db"), await cap("user")];
  if(!db || !user) return;
  const id = await user.id(); if(!id) return;
  dbDoc = db.doc("data/users/"+id+"/progress"); dbCol = db.collection("data/users/"+id);
  let first = true;
  dbDoc.onSnapshot(snap=>{
    if(snap.hasPendingWrites) return;
    if(first){ first=false; if(snap.exists) applyRemote(snap.data(), true); queueSync(); return; }   // 1re fois : fusion
    if(snap.exists && (snap.data().updatedAt||0) > store.get("updatedAt",0)) applyRemote(snap.data(), false); // autre appareil
  }, ()=>{});
  const qs = await dbCol.get(); const byId = Object.fromEntries(remakes.map(r=>[r.id,r]));
  qs.docs.filter(s=>s.id.startsWith("rm-") && s.exists).forEach(s=>{ const r=s.data(); if(!byId[r.id] || (r.upd||0) > (byId[r.id].upd||0)) byId[r.id]=r; });
  remakes = Object.values(byId).sort((a,b)=>(b.upd||0)-(a.upd||0)); store.set("remakes",remakes,true);
  remakes.forEach(r=>{ if(!qs.docs.some(s=>s.id==="rm-"+r.id)) syncRemake(r); });
  show();
}catch(e){} })();
